# CI de Nível 04 - Pipeline Integrada ao Build do Código

#nome da pipeline
name: 'Execução Integrada'

#gatilhos / triggers - regras de disparo
#gatilho manual = workflow_dispatch
#gatilho agendado = schedule
#gatilho por conclusão de outra pipeline = workflow_run

on:
  workflow_dispatch:

# tarefas dentro da pipeline = jobs

jobs:
  inspecao:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Intalando Yarn
        run: npm install -g yarn

      - name: Intalando depêndencias
        run: yarn

      - name: Inspeção de Código
        run: yarn lint

  unidade:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Intalando Yarn
        run: npm install -g yarn

      - name: Intalando depêndencias
        run: yarn

      - name: Rodando testes unitários
        run: yarn run test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [inspecao]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Intalando Yarn
        run: npm install -g yarn

      - name: Intalando depêndencias
        run: yarn

      - name: Intalando Browsers do Playwright
        run: yarn playwright install

      - name: Executando testes E2E
        run: yarn run e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [unidade, e2e-tests]

    steps:
      - name: Simulação de deploy
        run: echo 'Deploy sendo realizado...'
